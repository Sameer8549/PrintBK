name = "printbk-api"
main = "src/index.ts"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "printbk-d1"
database_id = "063df46c-bdbf-45bf-958e-9e62c59eaeb4"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "printbk-files"

[triggers]
crons = ["* * * * *"] # Every minute for auto-delete
