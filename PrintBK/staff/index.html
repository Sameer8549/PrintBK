<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; frame-src 'self' blob: data:; object-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' data: blob: http://localhost:* ws://localhost:* https://*.catalystserverless.com https://*.catalystserverless.in https://*.zoho.com https://*.zohocatalyst.com; base-uri 'self';" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrintBK" />
    <meta property="og:title" content="PrintBK Counter" />
    <meta property="og:description" content="PrintBK Counter workstation application for HKBK campus printing operations." />
    <meta property="og:image" content="./printbk-logo.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./printbk-logo.png" />
    <link rel="apple-touch-icon" href="./printbk-logo.png" />
    <title>PrintBK Counter</title>
  </head>
  <body>
    <div id="root"></div>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up any stale service workers or caches from earlier builds
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (const reg of regs) reg.unregister();
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then(keys => {
          for (const k of keys) caches.delete(k);
        }).catch(() => {});
      }
    </script>
  </body>
</html>
