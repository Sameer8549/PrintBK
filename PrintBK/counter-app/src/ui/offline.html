<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintBK Counter — Network Diagnostics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f4ee;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1.5px solid #0f172a;
      border-radius: 20px;
      padding: 36px;
      max-width: 540px;
      width: 100%;
      box-shadow: 6px 6px 0px #0f172a;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .badge.warn {
      background: #fef3c7;
      color: #92400e;
      border-color: #fcd34d;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }
    h1 {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }
    p.summary {
      color: #475569;
      font-size: 14px;
      line-height: 1.55;
      margin-bottom: 18px;
    }
    .hint-box {
      background: #fffbeb;
      border: 1.5px solid #fde68a;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
      color: #78350f;
      margin-bottom: 16px;
    }
    .hint-box strong {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .tech-details {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: #334155;
      line-height: 1.5;
      margin-bottom: 22px;
      word-break: break-word;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button.primary {
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
      transition: all 0.15s ease;
    }
    button.primary:hover { background: #1e293b; }
    button.accent {
      background: #fef3c7;
      color: #92400e;
      border: 1.5px solid #f59e0b;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.accent:hover { background: #fde68a; }
    button.secondary {
      background: transparent;
      color: #475569;
      border: 1.5px solid #cbd5e1;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .status-text {
      margin-top: 16px;
      font-size: 12.5px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="categoryBadge">
      <div class="pulse-dot"></div>
      <span id="badgeLabel">SERVER REACHABILITY PAUSED</span>
    </div>
    <h1 id="headline">Network Connection Lost</h1>
    <p class="summary" id="summary">
      PrintBK Counter cannot reach the shop cloud gateway. The background print agent will continue retrying automatically.
    </p>

    <div class="hint-box" id="hintBox" style="display: none;">
      <strong>Recommended Action on Campus / Office Ethernet</strong>
      <div id="actionHint"></div>
    </div>

    <div class="tech-details" id="techDetails" style="display: none;"></div>

    <div class="actions">
      <button class="primary" id="retryBtn">Retry Connection Now</button>
      <button class="accent" id="captivePortalBtn" style="display: none;">Open Captive Portal Login in Browser</button>
      <button class="secondary" id="networkSettingsBtn" style="display: none;">Open Windows Proxy &amp; Network Settings</button>
      <button class="secondary" id="checkHealthBtn">Check System Health &amp; LAN Diagnostics</button>
    </div>
    <div class="status-text" id="statusText">
      Auto-reconnecting in <span id="countdown">8</span> seconds…
    </div>
  </div>

  <script>
    let secondsLeft = 8;
    const countdownEl = document.getElementById('countdown');
    const retryBtn = document.getElementById('retryBtn');
    const captivePortalBtn = document.getElementById('captivePortalBtn');
    const networkSettingsBtn = document.getElementById('networkSettingsBtn');
    const checkHealthBtn = document.getElementById('checkHealthBtn');
    const categoryBadge = document.getElementById('categoryBadge');
    const badgeLabel = document.getElementById('badgeLabel');
    const headline = document.getElementById('headline');
    const summary = document.getElementById('summary');
    const hintBox = document.getElementById('hintBox');
    const actionHint = document.getElementById('actionHint');
    const techDetails = document.getElementById('techDetails');

    function renderDiagnostic(diag) {
      if (!diag) return;
      if (diag.badge) badgeLabel.textContent = diag.badge;
      if (diag.category === 'CAPTIVE_PORTAL' || diag.category === 'SSL_INTERCEPT' || diag.category === 'PROXY_AUTH') {
        categoryBadge.classList.add('warn');
      } else {
        categoryBadge.classList.remove('warn');
      }
      if (diag.title) headline.textContent = diag.title;
      if (diag.message) summary.textContent = diag.message;
      if (diag.actionHint) {
        actionHint.textContent = diag.actionHint;
        hintBox.style.display = 'block';
      }

      const lines = [];
      if (diag.code) lines.push(`Error Code:   ${diag.code}${diag.numericCode ? ' (' + diag.numericCode + ')' : ''}`);
      if (diag.url) lines.push(`Endpoint:     ${diag.url}`);
      if (diag.proxyInfo) lines.push(`System Proxy: ${diag.proxyInfo}`);
      if (diag.certIssuer) lines.push(`Cert Issuer:  ${diag.certIssuer}`);
      if (diag.portWarning) lines.push(`Port Check:   ${diag.portWarning}`);
      if (lines.length > 0) {
        techDetails.textContent = lines.join('\n');
        techDetails.style.whiteSpace = 'pre-wrap';
        techDetails.style.display = 'block';
      }

      const showPortal = diag.category === 'CAPTIVE_PORTAL' || diag.category === 'SSL_INTERCEPT' || diag.category === 'TIMEOUT';
      const showNetSettings = diag.category === 'PROXY_ERROR' || diag.category === 'PROXY_AUTH' || diag.category === 'DNS_ERROR';
      captivePortalBtn.style.display = showPortal ? 'block' : 'none';
      networkSettingsBtn.style.display = showNetSettings ? 'block' : 'none';
    }

    async function loadDiagnostics() {
      if (!window.printbkCounter?.getNetworkDiagnostics) return;
      try {
        const diag = await window.printbkCounter.getNetworkDiagnostics();
        renderDiagnostic(diag);
      } catch (_) {}
    }

    async function triggerReconnect() {
      if (window.printbkCounter && typeof window.printbkCounter.reloadStaffApp === 'function') {
        const statusEl = document.getElementById('statusText');
        if (statusEl) statusEl.textContent = 'Connecting via Chromium system network stack…';
        await window.printbkCounter.reloadStaffApp();
      } else {
        window.location.reload();
      }
    }

    const timer = setInterval(() => {
      secondsLeft--;
      if (countdownEl) countdownEl.textContent = secondsLeft;
      if (secondsLeft <= 0) {
        secondsLeft = 8;
        triggerReconnect();
      }
    }, 1000);

    retryBtn.addEventListener('click', () => {
      secondsLeft = 8;
      triggerReconnect();
    });

    captivePortalBtn.addEventListener('click', () => {
      window.printbkCounter?.openCaptivePortal?.();
    });

    networkSettingsBtn.addEventListener('click', () => {
      window.printbkCounter?.openWindowsNetworkSettings?.();
    });

    checkHealthBtn.addEventListener('click', () => {
      window.location.href = 'health.html';
    });

    window.addEventListener('online', () => triggerReconnect());
    window.addEventListener('DOMContentLoaded', loadDiagnostics);
    window.printbkCounter?.onNetworkDiagnostic?.(renderDiagnostic);
  </script>
</body>
</html>
